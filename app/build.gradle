plugins {
    id 'com.android.application'
}

// Release signing comes from the environment so the keystore never lives in the repo.
def releaseStore = System.getenv('APPHUB_KEYSTORE')

android {
    namespace 'com.hafij.apphub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hafij.apphub'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword System.getenv('APPHUB_KEYSTORE_PASS')
                keyAlias System.getenv('APPHUB_KEY_ALIAS')
                keyPassword System.getenv('APPHUB_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStore) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
